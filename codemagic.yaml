workflows:
  ios-release:
    name: iOS Release (App Store / TestFlight)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic CI
    environment:
      vars:
        APP_STORE_APPLE_ID: 6766818443
        BUNDLE_ID: "jp.galiverman.kokorocompass"
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Set up keychain
        script: |
          keychain initialize
      - name: Generate Apple Distribution private key
        script: |
          if [ ! -f /tmp/apple_distribution.key ]; then
            ssh-keygen -t rsa -b 2048 -m PEM -f /tmp/apple_distribution.key -q -N ""
          fi
      - name: Create distribution certificate (if not exists)
        script: |
          app-store-connect certificates create \
            --type IOS_DISTRIBUTION \
            --certificate-key=@file:/tmp/apple_distribution.key \
            --save 2>&1 || echo "Certificate already exists or creation skipped"
      - name: Create App Store provisioning profile (if not exists)
        script: |
          app-store-connect profiles create \
            --bundle-id "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --save 2>&1 || echo "Profile already exists or creation skipped"
      - name: Fetch all signing files to standard locations
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@file:/tmp/apple_distribution.key
      - name: Verify signing files were saved
        script: |
          echo "=== Provisioning Profiles ==="
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles/ 2>/dev/null || echo "(empty)"
          echo "=== Certificates ==="
          ls -la ~/Library/codemagic-cli-tools/certificates/ 2>/dev/null || echo "(empty)"
      - name: Add certificates to keychain
        script: |
          keychain add-certificates
      - name: Set up code signing
        script: |
          xcode-project use-profiles
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Generate launcher icons
        script: |
          dart run flutter_launcher_icons
      - name: Pod install
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Set build number and build IPA
        script: |
          cd $CM_BUILD_DIR
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo "0")
          BUILD_NUMBER=$((LATEST_BUILD_NUMBER + 1))
          echo "Setting build number to $BUILD_NUMBER"
          flutter build ipa --release \
            --build-name=1.0.0 \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Internal Tester
        submit_to_app_store: false

  ios-debug-build:
    name: iOS Debug Build (動作確認用)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Generate launcher icons
        script: |
          dart run flutter_launcher_icons
      - name: Pod install
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Build iOS debug (no signing)
        script: |
          flutter build ios --debug --no-codesign
    artifacts:
      - build/ios/iphoneos/*.app

  android-release:
    name: Android Release (Google Play 用)
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      android_signing:
        - kokorocompass_keystore
      vars:
        PACKAGE_NAME: "jp.galiverman.kokorocompass"
      flutter: stable
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Generate launcher icons
        script: |
          dart run flutter_launcher_icons
      - name: Build Android App Bundle
        script: |
          flutter build appbundle --release \
            --build-name=1.0.0 \
            --build-number=1
    artifacts:
      - build/**/outputs/**/*.aab
      - build/**/outputs/**/mapping.txt
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true
