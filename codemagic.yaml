workflows:
  ios-release:
    name: iOS Release (App Store / TestFlight)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic CI
    environment:
      vars:
        APP_STORE_APPLE_ID: 6766818443
        BUNDLE_ID: "jp.galiverman.kokorocompass"
      flutter: stable
      xcode: latest
      cocoapods: default
    cache:
      cache_paths:
        - $HOME/apple_distribution.key
        - $HOME/Library/MobileDevice/Provisioning Profiles
        - $HOME/Library/MobileDevice/Certificates
    scripts:
      - name: Set up keychain and required directories
        script: |
          keychain initialize
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          mkdir -p ~/Library/MobileDevice/Certificates
      - name: Generate or reuse Apple Distribution private key
        script: |
          KEY_PATH="$HOME/apple_distribution.key"
          if [ ! -f "$KEY_PATH" ]; then
            echo "Generating new private key..."
            ssh-keygen -t rsa -b 2048 -m PEM -f "$KEY_PATH" -q -N ""
          else
            echo "Reusing existing private key from cache."
          fi
          cp "$KEY_PATH" /tmp/apple_distribution.key
      - name: List Apple Developer state (before fetch)
        script: |
          echo "=== Existing certificates on Apple side ==="
          app-store-connect certificates list --type IOS_DISTRIBUTION || true
          echo ""
          echo "=== Existing profiles on Apple side ==="
          app-store-connect profiles list --bundle-id "$BUNDLE_ID" --type IOS_APP_STORE || true
      - name: Fetch or create signing files (single call for cert + profile)
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@file:/tmp/apple_distribution.key \
            --profiles-dir "$HOME/Library/MobileDevice/Provisioning Profiles" \
            --certificates-dir "$HOME/Library/MobileDevice/Certificates" \
            --create
      - name: Verify signing files were saved to disk
        script: |
          echo "=== Provisioning Profiles directory ==="
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles/ 2>/dev/null
          echo ""
          echo "=== Certificates directory ==="
          ls -la ~/Library/MobileDevice/Certificates/ 2>/dev/null
      - name: Add certificates to keychain
        script: |
          keychain add-certificates
      - name: Inspect keychain and profiles before code signing
        script: |
          echo "=== Available code signing identities ==="
          security find-identity -v -p codesigning || true
          echo ""
          echo "=== Profile files ==="
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles/
          echo ""
          echo "=== Profile contents (first one) ==="
          PROFILE=$(ls ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision | head -1)
          security cms -D -i "$PROFILE" | head -50 || true
      - name: Set up code signing (verbose)
        script: |
          xcode-project use-profiles --verbose
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Generate launcher icons
        script: |
          dart run flutter_launcher_icons
      - name: Pod install
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Set build number and build IPA
        script: |
          cd $CM_BUILD_DIR
          # Get latest build number across both App Store AND TestFlight (whichever is higher)
          APP_STORE_LATEST=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo "0")
          TESTFLIGHT_LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo "0")
          # Take the maximum of the two
          if [ "$APP_STORE_LATEST" -gt "$TESTFLIGHT_LATEST" ]; then
            LATEST_BUILD_NUMBER=$APP_STORE_LATEST
          else
            LATEST_BUILD_NUMBER=$TESTFLIGHT_LATEST
          fi
          BUILD_NUMBER=$((LATEST_BUILD_NUMBER + 1))
          echo "App Store latest: $APP_STORE_LATEST"
          echo "TestFlight latest: $TESTFLIGHT_LATEST"
          echo "Setting build number to $BUILD_NUMBER"
          flutter build ipa --release \
            --build-name=1.0.0 \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Internal Tester
        submit_to_app_store: false

  ios-debug-build:
    name: iOS Debug Build (動作確認用)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Generate launcher icons
        script: |
          dart run flutter_launcher_icons
      - name: Pod install
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Build iOS debug (no signing)
        script: |
          flutter build ios --debug --no-codesign
    artifacts:
      - build/ios/iphoneos/*.app

  android-release:
    name: Android Release (Google Play 用)
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      android_signing:
        - kokorocompass_keystore
      vars:
        PACKAGE_NAME: "jp.galiverman.kokorocompass"
      flutter: stable
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Generate launcher icons
        script: |
          dart run flutter_launcher_icons
      - name: Build Android App Bundle
        script: |
          flutter build appbundle --release \
            --build-name=1.0.0 \
            --build-number=1
    artifacts:
      - build/**/outputs/**/*.aab
      - build/**/outputs/**/mapping.txt
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true
